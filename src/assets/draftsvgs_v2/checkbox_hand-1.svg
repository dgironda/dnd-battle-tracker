      <feComposite in="w" in2="ta" operator="in" result="g"/>
      <feGaussianBlur in="g" stdDeviation="0.5"/>
    </filter>
  </defs>
  <rect x="26" y="27" width="78" height="76" rx="17" ry="15" fill="none" stroke="#000" stroke-width="6.2" stroke-linejoin="round" filter="url(#ink1)"/>
