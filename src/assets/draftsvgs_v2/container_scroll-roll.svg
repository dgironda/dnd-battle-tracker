<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- The rolled end of a scroll. Generated by tools/generate-hand-art.mjs.

     Nine-slice it VERTICALLY and nowhere else: slice 18.33% top and bottom
     with 0 left and right, and set border-image-width in this artwork's own
     ratio (cap = width * 0.9167) or the knobs will squash. Everything
     between the caps is a vertical band and stretches invisibly. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 600" preserveAspectRatio="none">
  <defs>
    <filter id="rollWobble" x="-8%" y="-3%" width="116%" height="106%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.006" numOctaves="2" seed="317" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rollWobble)">
    <!-- the rod, behind the paper; only its ends are ever seen -->
    <rect x="51" y="26" width="18" height="548" fill="#4f2314"/>
    <rect x="51" y="26" width="7" height="548" fill="#79412e"/>

    <!-- the wound paper -->
    <path d="M10,88 A50,20 0 0 1 110,88 L110,512 A50,20 0 0 1 10,512 Z" fill="#ceb59c" stroke="#3e1709" stroke-width="3.2" stroke-linejoin="round"/>
    <!-- lit down the left of the tube, in shadow where the sheet leaves it -->
    <path d="M22,92 L22,516 L12,506 L12,100 Z" fill="#bd9d7d"/>
    <path d="M30,86 L30,522 L58,526 L58,82 Z" fill="#d2bba4"/>
    <path d="M92,90 L92,520 L108,508 L108,98 Z" fill="#bd9d7d"/>
    <!-- the edge of the wound sheet, so it reads as rolled and not as a pipe -->
    <path d="M86,94 L86,516" stroke="#3e1709" stroke-width="2.2" fill="none" opacity="0.55"/>
    <!-- the ellipse at each end of the tube, drawn over the bands -->
    <ellipse cx="60" cy="88" rx="50" ry="20" fill="#d2bba4" stroke="#3e1709" stroke-width="3.2"/>
    <ellipse cx="60" cy="88" rx="21" ry="8" fill="#bd9d7d" stroke="#3e1709" stroke-width="2"/>
    <ellipse cx="60" cy="512" rx="50" ry="20" fill="#ceb59c" stroke="#3e1709" stroke-width="3.2"/>
    <ellipse cx="60" cy="512" rx="21" ry="8" fill="#bd9d7d" stroke="#3e1709" stroke-width="2"/>

    <!-- the turned knobs on the ends of the rod, wide enough to read against
         the tube rather than sitting on it like buttons -->
    <ellipse cx="60" cy="32" rx="31" ry="24" fill="#79412e" stroke="#3e1709" stroke-width="3.2"/>
    <ellipse cx="51" cy="25" rx="11" ry="8" fill="#a06a4c"/>
    <ellipse cx="60" cy="568" rx="31" ry="24" fill="#79412e" stroke="#3e1709" stroke-width="3.2"/>
    <ellipse cx="51" cy="561" rx="11" ry="8" fill="#a06a4c"/>
  </g>
</svg>
